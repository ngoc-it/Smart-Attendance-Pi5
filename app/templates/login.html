<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Smart Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- MTU BRANDING HEADER -->
            <div class="mtu-header">
                <img src="{{ url_for('static', filename='images/mtu_logo.png') }}" alt="MTU Logo" class="mtu-logo">
                <div class="mtu-titles">
                    <h1>Bộ Xây Dựng</h1>
                    <h2>TRƯỜNG ĐẠI HỌC<br>XÂY DỰNG MIỀN TÂY</h2>
                </div>
                <div class="system-title">SMART ATTENDANCE</div>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash-msg">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="role" value="lecturer" checked> 
                        <span>👨‍🏫 Giảng viên</span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="admin"> 
                        <span>🛠 Admin</span>
                    </label>
                </div>

                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" placeholder="Nhập mã cán bộ / admin" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login">ĐĂNG NHẬP HỆ THỐNG</button>
            </form>
            
            <div style="text-align: center; margin-top: 25px; font-size: 0.8rem; color: #888;">
                © 2026 MTU Smart Attendance System
            </div>
        </div>
    </div>
</body>
</html>
