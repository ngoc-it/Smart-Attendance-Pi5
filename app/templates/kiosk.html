<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Điểm Danh</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kiosk.css') }}">
    <style>
        .session-info {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-align: center;
            font-weight: 600;
        }
        .btn-check.active {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
            animation: pulse 2s infinite;
        }
        .btn-check.upcoming {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
        }
        .btn-check.idle {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            opacity: 0.8;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>HỆ THỐNG ĐIỂM DANH TỰ ĐỘNG</h1>
        <button onclick="exitApp()" class="btn-exit" title="Thoát ứng dụng">✖</button>
    </div>

    <div class="main-content">
        <div class="camera-container">
            <img src="" id="kiosk-cam" alt="Camera">
            <div class="face-guide"></div>
        </div>

        <div class="action-panel">
            <div id="session-info" class="session-info">Đang kiểm tra tiết học...</div>
            <button class="btn-check" id="btn-check" onclick="performCheckIn()">
                ĐIỂM DANH
            </button>
            <div class="instruction">
                <p>1. Đứng vào trong khung hình.</p>
                <p>2. Chắc chắn chỉ có 1 người.</p>
                <p>3. Bấm nút ĐIỂM DANH.</p>
            </div>
        </div>
    </div>

    <!-- Popup -->
    <div id="popup" class="popup">
        <div id="popup-icon" class="popup-icon"></div>
        <div id="popup-title" class="popup-title"></div>
        <div id="popup-message" class="popup-message"></div>
    </div>

    <script>
        document.getElementById('kiosk-cam').src = "{{ url_for('attendance.video_feed') }}?t=" + new Date().getTime();

        const btnCheck = document.getElementById('btn-check');
        const sessionInfo = document.getElementById('session-info');
        const popup = document.getElementById('popup');
        const popupIcon = document.getElementById('popup-icon');
        const popupTitle = document.getElementById('popup-title');
        const popupMessage = document.getElementById('popup-message');

        let popupTimeout;

        function showPopup(type, title, message) {
            clearTimeout(popupTimeout);
            popup.className = `popup show ${type}-theme`;
            popupIcon.innerHTML = type === 'success' ? '✅' : '❌';
            popupTitle.innerText = title;
            popupMessage.innerText = message;
            popupTimeout = setTimeout(() => {
                popup.classList.remove('show');
            }, 4000);
        }

        function updateSessionStatus() {
            fetch('/api/kiosk/current_session')
            .then(res => res.json())
            .then(data => {
                btnCheck.classList.remove('active', 'upcoming', 'idle');
                
                if (data.status === 'active') {
                    btnCheck.classList.add('active');
                    btnCheck.disabled = false;
                    sessionInfo.innerHTML = `<span style="color:#2ecc71">● Đang diễn ra:</span> ${data.class_name}`;
                    btnCheck.innerHTML = `ĐIỂM DANH<br><small style="font-size:0.65rem">${data.start_time} - ${data.end_time}</small>`;
                } else if (data.status === 'upcoming') {
                    btnCheck.classList.add('upcoming');
                    btnCheck.disabled = false;
                    sessionInfo.innerHTML = `<span style="color:#f1c40f">● Sắp diễn ra:</span> ${data.class_name}`;
                    btnCheck.innerHTML = `CHỜ ĐẾN GIỜ<br><small style="font-size:0.65rem">Bắt đầu lúc ${data.start_time}</small>`;
                } else {
                    btnCheck.classList.add('idle');
                    btnCheck.disabled = true;
                    sessionInfo.innerText = "Hiện không có ca học nào";
                    btnCheck.innerText = "ĐIỂM DANH";
                }
            })
            .catch(err => console.error("Session update failed", err));
        }

        // Poll session info every 15 seconds
        setInterval(updateSessionStatus, 15000);
        updateSessionStatus();

        function exitApp() {
            if (confirm("Bạn có chắc chắn muốn thoát ứng dụng?")) {
                fetch('/api/kiosk/exit', { method: 'POST' })
                .catch(err => console.error("Exit failed", err));
            }
        }

        function performCheckIn() {
            const originalText = btnCheck.innerHTML;
            btnCheck.disabled = true;
            btnCheck.innerText = "...";

            fetch('/api/kiosk/check', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showPopup('success', `Check-${data.action} Thành Công`, data.message);
                } else {
                    showPopup('error', 'Lỗi Điểm Danh', data.message);
                }
            })
            .catch(err => {
                showPopup('error', 'Lỗi Hệ Thống', 'Không thể kết nối đến máy chủ AI.');
            })
            .finally(() => {
                setTimeout(() => {
                    updateSessionStatus();
                }, 2000);
            });
        }
    </script>
</body>
</html>
